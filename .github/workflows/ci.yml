name: App checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: returnready
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py collectstatic --noinput && python manage.py makemigrations --check --dry-run && python manage.py test
        env:
          DEBUG: '1'
      - run: python manage.py test
        env:
          DEBUG: '1'
          DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/returnready
          LOCAL_POSTGRES: '1'
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          SECRET_KEY: ci-only-secret-key-not-used-for-deployment-8f10f8bebd68
          DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/returnready
